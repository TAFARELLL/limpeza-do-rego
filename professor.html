<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor | Limpeza do Rego</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Registro de Limpeza</h1>
            <p>Avaliação pós-aula para o ranking bimestral</p>
        </header>

        <form id="formAvaliacao" class="form-grid">
            <div class="form-group full">
                <label for="professor">Nome do Professor(a)</label>
                <input type="text" id="professor" placeholder="Ex: Prof. Dimas" required>
            </div>

            <div class="form-group">
                <label for="sala">Turma / Sala</label>
                <select id="sala" required>
                    <option value="" disabled selected>Selecione a sala...</option>
                    <option value="1ºA">1º Ano A</option>
                    <option value="1ºB">1º Ano B</option>
                    <option value="1ºC">1º Ano C</option>
                    <option value="1ºD">1º Ano D</option>
                    <option value="2ºA">2º Ano A</option>
                    <option value="2ºB">2º Ano B</option>
                    <option value="3ºA">3º Ano A</option>
                    <option value="3ºB">3º Ano B</option>
                </select>
            </div>

            <div class="form-group">
                <label for="data_avaliacao">Data da Aula</label>
                <input type="date" id="data_avaliacao" required>
            </div>

            <div class="form-group full">
                <label for="pontuacao">Nota de Limpeza (0 a 10)</label>
                <input type="number" id="pontuacao" min="0" max="10" step="1" placeholder="Ex: 9" required>
            </div>

            <div class="form-group full">
                <button type="submit" class="btn" id="btnSalvar">Registrar Pontuação</button>
            </div>
        </form>

        <div id="feedback"></div>
    </div>

    <script>
        // Preenche a data de hoje automaticamente
        document.getElementById('data_avaliacao').valueAsDate = new Date();

        const form = document.getElementById('formAvaliacao');
        const feedback = document.getElementById('feedback');
        const btnSalvar = document.getElementById('btnSalvar');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnSalvar.disabled = true;
            btnSalvar.textContent = 'Salvando...';

            const dados = {
                professor: document.getElementById('professor').value.trim(),
                sala: document.getElementById('sala').value,
                pontuacao: Number(document.getElementById('pontuacao').value),
                data_avaliacao: document.getElementById('data_avaliacao').value
            };

            try {
                const resposta = await fetch('http://localhost:3000/api/avaliacoes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const resultado = await resposta.json();

                if (resposta.ok) {
                    mostrarFeedback(resultado.mensagem, 'sucesso');
                    document.getElementById('pontuacao').value = '';
                    document.getElementById('sala').selectedIndex = 0;
                } else {
                    mostrarFeedback(resultado.erro || 'Erro ao salvar.', 'erro');
                }
            } catch (err) {
                mostrarFeedback('Servidor offline. Verifique se o Node.js está rodando.', 'erro');
            } finally {
                btnSalvar.disabled = false;
                btnSalvar.textContent = 'Registrar Pontuação';
            }
        });

        function mostrarFeedback(texto, tipo) {
            feedback.textContent = texto;
            feedback.className = tipo;
            feedback.style.display = 'block';
            setTimeout(() => { feedback.style.display = 'none'; }, 5000);
        }
    </script>

</body>
</html>
