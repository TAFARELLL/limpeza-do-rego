<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ranking - Limpe o Rego</title>
  <style>
    @import url('https://googleapis.com');
    body {
      font-family: 'Amatic SC', Arial, sans-serif;
      font-size: 26px;
      max-width: 600px;
      margin: 40px auto;
      background: #f4f4f9;
      padding: 20px;
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
    }
    th, td {
      padding: 12px;
      border: 1px solid #ddd;
    }
    th {
      background: #007bff;
      color: white;
    }
  </style>
</head>
<body>
  <h1>🧹 Ranking de Limpeza</h1>
  <table>
    <thead>
      <tr>
        <th>Posição</th>
        <th>Sala</th>
        <th>Total de Pontos</th>
      </tr>
    </thead>
    <tbody id="tabela"></tbody>
  </table>

  <script>
    async function carregar() {
      const res = await fetch('/api/notas');
      const lista = await res.json();
      lista.sort((a, b) => b.pontos - a.pontos);
      const tbody = document.getElementById('tabela');
      tbody.innerHTML = lista.map((item, i) => `
        <tr>
          <td>${i + 1}º</td>
          <td>${item.sala}</td>
          <td>${item.pontos}</td>
        </tr>
      `).join('');
    }
    carregar();
  </script>
</body>
</html>
